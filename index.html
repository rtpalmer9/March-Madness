<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0d0d0f"/>
<title>Madness Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:#0d0d0f;color:#f0f0f2;font-family:'Inter',sans-serif;font-size:15px;overflow-x:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
:root{
  --bg:#0d0d0f;--s1:#161618;--s2:#1c1c1f;--s3:#222226;--s4:#2a2a2f;
  --rim:rgba(255,255,255,0.07);--rim2:rgba(255,255,255,0.13);
  --orange:#f06a25;--orange2:#ff8c47;--orangef:rgba(240,106,37,0.13);
  --red:#e84855;--redf:rgba(232,72,85,0.12);
  --green:#1db974;--greenf:rgba(29,185,116,0.11);
  --gold:#f5c842;--silver:#9ba8b8;--bronze:#c47c3a;
  --text:#f0f0f2;--text2:#7a7a85;--text3:#3a3a42;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --nav-h:60px;
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 40% at 100% 0%,rgba(240,106,37,.06) 0%,transparent 55%),
             radial-gradient(ellipse 60% 35% at 0% 100%,rgba(245,200,66,.04) 0%,transparent 55%)}

/* ── TOP BAR ── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;height:calc(52px + var(--safe-t));padding-top:var(--safe-t);
  display:flex;align-items:center;justify-content:space-between;padding-left:18px;padding-right:18px;
  background:rgba(13,13,15,0.92);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-bottom:1px solid var(--rim)}
.tb-logo{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;letter-spacing:1px}
.tb-logo em{color:var(--orange);font-style:normal}
.tb-right{display:flex;align-items:center;gap:10px}
.live-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  background:var(--redf);border:1px solid rgba(232,72,85,.22);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red)}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--red);animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.upd{font-size:11px;color:var(--text3);letter-spacing:.3px}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:60;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;align-items:stretch;
  background:rgba(13,13,15,0.96);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-top:1px solid var(--rim)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;border:none;background:transparent;color:var(--text3);transition:color .18s;padding:0 4px}
.bni.on{color:var(--orange)}
.bni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bni span{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

/* ── PAGE WRAP ── */
.page-wrap{position:relative;z-index:1;padding-top:calc(52px + var(--safe-t));padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px);min-height:100dvh}
.view{display:none;animation:fadeUp .25s ease both}
.view.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.inner{padding:16px 14px;max-width:640px;margin:0 auto}

/* ── STAT STRIP ── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.stat-box{background:var(--s1);border:1px solid var(--rim);border-radius:14px;padding:14px 8px 12px;text-align:center}
.stat-box .v{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--orange);line-height:1}
.stat-box .l{font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2);margin-top:4px}

/* ── LEADERBOARD ── */
.lb-stack{display:flex;flex-direction:column;gap:9px}
.lb-card{background:var(--s1);border:1px solid var(--rim);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .2s}
.lb-card:active{transform:scale(.995)}
.lb-card.r1{border-color:rgba(245,200,66,.3);background:linear-gradient(140deg,#1a1710 0%,#161618 100%)}
.lb-card.r2{border-color:rgba(155,168,184,.18)}
.lb-card.r3{border-color:rgba(196,124,58,.2)}
.lb-card.open .lb-head{border-bottom:1px solid var(--rim)}
.lb-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lb-rank{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:17px;font-weight:700}
.r1 .lb-rank{background:var(--gold);color:#0d0d0f}
.r2 .lb-rank{background:var(--silver);color:#0d0d0f}
.r3 .lb-rank{background:var(--bronze);color:#fff}
.rn .lb-rank{background:var(--s3);color:var(--text2)}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:12px;color:var(--text2);margin-top:2px}
.lb-score{text-align:right;flex-shrink:0}
.lb-pts{font-family:'Oswald',sans-serif;font-size:36px;font-weight:700;line-height:1}
.r1 .lb-pts{color:var(--gold)}.r2 .lb-pts{color:var(--silver)}.r3 .lb-pts{color:var(--bronze)}.rn .lb-pts{color:var(--orange)}
.lb-ptslbl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.lb-chev{width:16px;height:16px;flex-shrink:0;stroke:var(--text3);fill:none;stroke-width:2.2;stroke-linecap:round;transition:transform .25s}
.lb-card.open .lb-chev{transform:rotate(180deg)}
.lb-panel{max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1)}
.lb-card.open .lb-panel{max-height:480px}
.lb-panel-inner{padding:10px 14px 14px;display:flex;flex-direction:column;gap:7px}

/* ── PLAYER ROW ── */
.pr{display:flex;align-items:center;gap:9px;background:var(--s2);border-radius:10px;padding:9px 10px}
.pr.elim{opacity:.36}
.pr-logo{width:26px;height:26px;border-radius:6px;object-fit:contain;background:var(--s3);flex-shrink:0}
.pr-logofb{width:26px;height:26px;border-radius:6px;background:var(--s3);border:1px solid var(--rim2);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--text2);flex-shrink:0}
.pr-info{flex:1;min-width:0}
.pr-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr.elim .pr-name{text-decoration:line-through;color:var(--text2)}
.pr-team{font-size:11px;color:var(--text3);margin-top:1px}
.pr-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pr-dot.alive{background:var(--green)}.pr-dot.out{background:var(--red)}.pr-dot.idle{background:var(--s4)}
.pr-pts{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;color:var(--orange);flex-shrink:0;min-width:28px;text-align:right}
.pr.elim .pr-pts{color:var(--text3)}

/* ── TEAMS VIEW ── */
.teams-stack{display:flex;flex-direction:column;gap:12px}
.team-card{background:var(--s1);border:1px solid var(--rim);border-radius:16px;overflow:hidden;animation:fadeUp .35s ease both}
.team-hdr{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rim)}
.team-owner{font-size:16px;font-weight:600;color:var(--text);flex:1}
.team-total{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:var(--orange);line-height:1;flex-shrink:0}
.team-players{padding:10px 14px 14px;display:flex;flex-direction:column;gap:7px}

/* ── BRACKET ── */
.bracket-hint{font-size:12px;color:var(--text3);text-align:center;margin-bottom:12px}
.bracket-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.bracket-outer::-webkit-scrollbar{height:3px}
.bracket-outer::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}
.bracket{display:flex;width:max-content;min-width:100%}
.b-round{display:flex;flex-direction:column;min-width:148px;padding:0 4px}
.b-round-lbl{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);text-align:center;padding:10px 4px 12px}
.b-games{display:flex;flex-direction:column;flex:1;justify-content:space-around;gap:4px}
.b-game{background:var(--s1);border:1px solid var(--rim);border-radius:10px;overflow:hidden}
.b-game.live{border-color:rgba(240,106,37,.4)}
.b-team{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--rim)}
.b-team:last-child{border-bottom:none}
.b-team.winner{background:rgba(29,185,116,.08)}
.b-team.loser{opacity:.38}
.b-seed{font-size:10px;font-weight:700;color:var(--text3);width:14px;text-align:center;flex-shrink:0}
.b-tlogo{width:18px;height:18px;border-radius:4px;object-fit:contain;background:var(--s3);flex-shrink:0}
.b-tlogofb{width:18px;height:18px;border-radius:4px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:var(--text3);flex-shrink:0}
.b-tname{flex:1;font-size:11px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-team.loser .b-tname{color:var(--text3)}
.b-score{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:var(--text);flex-shrink:0;min-width:22px;text-align:right}
.b-team.winner .b-score{color:var(--green)}
.b-status{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:3px;color:var(--orange)}
.bracket-msg{text-align:center;padding:40px 20px;color:var(--text2);font-size:14px}

/* ── EDIT VIEW ── */
.edit-note{background:var(--orangef);border:1px solid var(--orangeb);border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:13px;color:var(--text2);line-height:1.6}
.edit-note strong{color:var(--text)}
.edit-slots{display:flex;flex-direction:column;gap:12px}
.edit-card{background:var(--s1);border:1px solid var(--rim);border-radius:16px;padding:16px}
.edit-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.edit-num{width:28px;height:28px;border-radius:50%;background:var(--orangef);border:1px solid var(--orangeb);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;color:var(--orange);flex-shrink:0}
.edit-name-inp{flex:1;background:var(--s2);border:1px solid var(--rim2);border-radius:9px;padding:10px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;outline:none;transition:border-color .2s}
.edit-name-inp:focus{border-color:var(--orange)}
.edit-name-inp::placeholder{color:var(--text3)}
.picks-lbl{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:9px;margin-left:2px}
.pick-row{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.pick-row:last-child{margin-bottom:0}
.pick-n{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--orange);width:16px;text-align:center;flex-shrink:0}
.pick-inp{background:var(--s2);border:1px solid var(--rim2);border-radius:9px;padding:10px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .2s;flex:2}
.pick-inp:focus{border-color:var(--orange)}
.pick-inp::placeholder{color:var(--text3)}
.team-inp{flex:1}
.btn{width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;transition:all .18s}
.btn-primary{background:var(--orange);color:#0d0d0f}
.btn-primary:active{background:var(--orange2);transform:scale(.98)}
.btn-sec{background:transparent;border:1px solid var(--rim2);color:var(--text2);font-size:14px;letter-spacing:.5px;margin-top:8px}
.btn-sec:active{border-color:var(--orange);color:var(--orange)}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--s2);border:1px solid var(--rim2);border-radius:12px;padding:11px 18px;
  font-size:13px;font-weight:500;color:var(--text);z-index:999;opacity:0;transition:all .25s;
  pointer-events:none;white-space:nowrap;box-shadow:0 8px 40px rgba(0,0,0,.7)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── EMPTY ── */
.empty{text-align:center;padding:52px 20px;color:var(--text2)}
.empty .ico{font-size:44px;margin-bottom:14px}
.empty h3{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.65;max-width:260px;margin:0 auto}

/* ── SECTION LABEL ── */
.slbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;padding-left:2px}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-logo">MARCH <em>MADNESS</em></div>
  <div class="tb-right">
    <span class="upd" id="updTxt">—</span>
    <div class="live-pill"><div class="ldot"></div>Live</div>
  </div>
</div>

<div class="page-wrap">

  <!-- LEADERBOARD -->
  <div class="view on" id="v-lb">
    <div class="inner">
      <div class="stat-strip" id="statStrip"></div>
      <div class="slbl">Standings</div>
      <div class="lb-stack" id="lbStack"></div>
    </div>
  </div>

  <!-- TEAMS -->
  <div class="view" id="v-teams">
    <div class="inner">
      <div class="slbl">All Teams &amp; Players</div>
      <div class="teams-stack" id="teamsStack"></div>
    </div>
  </div>

  <!-- BRACKET -->
  <div class="view" id="v-bracket">
    <div class="inner">
      <div class="slbl">Tournament Bracket</div>
      <p class="bracket-hint">Scroll sideways →</p>
      <div class="bracket-outer"><div id="bracketWrap"></div></div>
    </div>
  </div>

  <!-- EDIT -->
  <div class="view" id="v-edit">
    <div class="inner">
      <div class="edit-note">
        <strong>Enter each person's name and their 5 players.</strong><br/>
        Type the player's name exactly as ESPN shows it, and their team name.
        Points will populate automatically once tournament games are played.
      </div>
      <div class="edit-slots" id="editSlots"></div>
      <div style="margin-top:16px">
        <button class="btn btn-primary" onclick="saveDraft()">Save Draft</button>
        <button class="btn btn-sec" onclick="clearDraft()">Clear All</button>
      </div>
    </div>
  </div>

</div>

<nav class="bnav">
  <button class="bni on" onclick="goTab('lb',this)">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span>Board</span>
  </button>
  <button class="bni" onclick="goTab('teams',this)">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>Teams</span>
  </button>
  <button class="bni" onclick="goTab('bracket',this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="9" y="15" width="6" height="6"/><line x1="6" y1="9" x2="6" y2="15"/><line x1="18" y1="9" x2="18" y2="15"/><line x1="6" y1="15" x2="12" y2="15"/><line x1="18" y1="15" x2="12" y2="15"/></svg>
    <span>Bracket</span>
  </button>
  <button class="bni" onclick="goTab('edit',this)">
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    <span>Edit</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// CONSTANTS & STATE
// ═══════════════════════════════════════════
const STORE = 'mm_2026';
const ROUND_KEYS  = ['r1a','r1b','r16','r8','r4','champ'];
const ROUND_NAMES = ['R1 Gm1','R1 Gm2','Sweet 16','Elite 8','Final Four','Champ'];
const PROXY = 'https://corsproxy.io/?';

const ABBR = {
  'duke':'DUKE','arizona':'ARIZ','michigan':'MICH','florida':'FLA',
  'houston':'HOU','purdue':'PUR','uconn':'CONN','iowa state':'ISU',
  'michigan state':'MSU','illinois':'ILL','gonzaga':'GONZ','virginia':'UVA',
  'nebraska':'NEB','kansas':'KAN','arkansas':'ARK','alabama':'ALA',
  'wisconsin':'WIS','vanderbilt':'VAN',"st. john's":'SJU','texas tech':'TTU',
  'louisville':'LOU','south florida':'USF','north carolina':'UNC','byu':'BYU',
  'tennessee':'TENN',"saint mary's":'SMC','miami (fla.)':'MIA','miami fl':'MIA',
  'ucla':'UCLA','kentucky':'UK','ohio state':'OSU','georgia':'UGA',
  'villanova':'NOVA','clemson':'CLEM','tcu':'TCU','saint louis':'SLU',
  'utah state':'USU','iowa':'IOWA','texas a&m':'TXAM','santa clara':'SCU',
  'ucf':'UCF','missouri':'MIZ','vcu':'VCU','texas':'TEX','nc state':'NCST',
  'miami (ohio)':'MIOH','miami ohio':'MIOH','smu':'SMU','northern iowa':'UNI',
  'high point':'HPU','mcneese':'MCNS','akron':'AKR','cal baptist':'CBU',
  'troy':'TROY','hawaii':'HAW','hofstra':'HOF','north dakota state':'NDSU',
  'penn':'PENN','wright state':'WRST','kennesaw state':'KENN','furman':'FUR',
  'queens':'QUNCC','tennessee state':'TNST','idaho':'IDHO','siena':'SIE',
  'long island university':'LIU','liu':'LIU','umbc':'UMBC','howard':'HOW',
  'lehigh':'LEH','prairie view a&m':'PVAM',
};

function logoUrl(team) {
  if (!team) return null;
  const a = ABBR[team.toLowerCase().trim()];
  return a ? `https://a.espncdn.com/i/teamlogos/ncaa/500/${a}.png` : null;
}
function logoImg(team, size) {
  const url = logoUrl(team);
  const px = size === 'lg' ? 36 : 26;
  const cls = size === 'lg' ? 'b-tlogo' : 'pr-logo';
  const fb  = size === 'lg' ? 'b-tlogofb' : 'pr-logofb';
  const abbr = team ? team.slice(0,3).toUpperCase() : '?';
  if (url) return `<img class="${cls}" src="${url}" width="${px}" height="${px}" alt=""
    onerror="this.outerHTML='<div class=\\'${fb}\\'>${abbr}</div>'" loading="lazy"/>`;
  return `<div class="${fb}">${abbr}</div>`;
}

let draft = loadDraft();
let openCard = null;
let bracketData = null;

function defDraft() {
  return Array.from({length:7}, () => ({
    name: '',
    picks: Array.from({length:5}, () => ({player:'', team:'', pts:{}, eliminated:false}))
  }));
}
function loadDraft() {
  // Check current key first, then fall back to older keys from previous versions
  const keys = ['mm_2026', 'mm_v4', 'mm_draft_v3', 'mm_league'];
  for (const k of keys) {
    try {
      const d = JSON.parse(localStorage.getItem(k));
      if (d && Array.isArray(d) && d.length) return d;
    } catch {}
  }
  return defDraft();
}
function saveDraftLocal() { localStorage.setItem(STORE, JSON.stringify(draft)); }

// ═══════════════════════════════════════════
// ESPN FETCH — with timeout
// ═══════════════════════════════════════════
async function espnFetch(url) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch(PROXY + encodeURIComponent(url), {signal: ctrl.signal});
    clearTimeout(timer);
    return r.ok ? r.json() : null;
  } catch { return null; }
}

function roundKey(game) {
  const t = ((game.notes||[]).map(n=>n.headline||'').join(' ') + ' ' + (game.name||'')).toLowerCase();
  if (t.includes('first round') || t.includes('round of 64'))  return 'r1a';
  if (t.includes('second round')|| t.includes('round of 32'))  return 'r1b';
  if (t.includes('sweet'))   return 'r16';
  if (t.includes('elite'))   return 'r8';
  if (t.includes('final four') || t.includes('semifinal'))     return 'r4';
  if (t.includes('champion')) return 'champ';
  return 'r1a';
}

// ═══════════════════════════════════════════
// REFRESH — renders immediately, fetches in bg
// ═══════════════════════════════════════════
async function refresh() {
  document.getElementById('updTxt').textContent = 'Updating…';
  renderAll(); // show local data immediately

  try {
    const sb = await espnFetch(
      'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?groups=100&limit=200'
    );
    if (!sb) { document.getElementById('updTxt').textContent = 'Offline'; return; }

    const events = sb.events || [];
    bracketData = events;
    renderBracket();

    const completed = events.filter(e => e.status?.type?.completed);

    // Eliminations from scoreboard data — no extra calls needed
    const elim = new Set();
    for (const g of completed) {
      for (const c of g.competitions||[]) {
        const teams = c.competitors||[];
        if (teams.length < 2) continue;
        const scores = teams.map(t => +(t.score||0));
        const max = Math.max(...scores);
        for (const t of teams)
          if (+(t.score||0) < max) elim.add((t.team?.displayName||'').toLowerCase());
      }
    }

    // Fetch box scores in parallel batches of 6
    const pts = {};
    for (let i = 0; i < completed.length; i += 6) {
      await Promise.all(completed.slice(i, i+6).map(async g => {
        const rk = roundKey(g);
        const box = await espnFetch(
          `https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/${g.id}/boxscore`
        );
        for (const td of box?.players||[]) {
          for (const cat of td.statistics||[]) {
            const pi = (cat.labels||[]).indexOf('PTS');
            for (const a of cat.athletes||[]) {
              const nm = (a.athlete?.displayName||'').toLowerCase();
              if (!nm) continue;
              const p = pi >= 0 ? +(a.stats?.[pi]||0) : 0;
              if (!pts[nm]) pts[nm] = {};
              pts[nm][rk] = (pts[nm][rk]||0) + p;
            }
          }
        }
      }));
    }

    // Update draft with new points + eliminations
    let changed = false;
    for (const dr of draft) {
      for (const p of dr.picks) {
        if (!p.player) continue;
        const key = p.player.toLowerCase();
        const np = pts[key] || {};
        const ne = elim.has(p.team.toLowerCase());
        if (JSON.stringify(p.pts) !== JSON.stringify(np) || p.eliminated !== ne) {
          p.pts = np; p.eliminated = ne; changed = true;
        }
      }
    }
    if (changed) { saveDraftLocal(); renderAll(); }

    document.getElementById('updTxt').textContent =
      new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('updTxt').textContent = 'Retry…';
    console.warn('Refresh error:', e);
  }
}

// ═══════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════
const pickPts  = p  => Object.values(p.pts||{}).reduce((a,b) => a+b, 0);
const draftTot = dr => dr.picks.reduce((s,p) => s + pickPts(p), 0);

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function renderAll() {
  renderStats();
  renderBoard();
  renderTeams();
  renderBracket();
}

function renderStats() {
  const all   = draft.flatMap(d => d.picks).filter(p => p.player);
  const alive = all.filter(p => !p.eliminated).length;
  const out   = all.filter(p => p.eliminated).length;
  const top   = Math.max(0, ...draft.map(draftTot));
  const named = draft.filter(d => d.name).length;
  document.getElementById('statStrip').innerHTML = `
    <div class="stat-box"><div class="v">${alive}</div><div class="l">Alive</div></div>
    <div class="stat-box"><div class="v">${out}</div><div class="l">Out</div></div>
    <div class="stat-box"><div class="v">${top}</div><div class="l">Leader</div></div>
    <div class="stat-box"><div class="v">${named}</div><div class="l">Teams</div></div>`;
}

function renderBoard() {
  const sorted = [...draft].sort((a,b) => draftTot(b) - draftTot(a));
  const el = document.getElementById('lbStack');

  if (!sorted.some(d => d.name)) {
    el.innerHTML = `<div class="empty">
      <div class="ico">🏀</div>
      <h3>No Draft Yet</h3>
      <p>Tap <strong>Edit</strong> to enter your picks.</p>
    </div>`;
    return;
  }

  el.innerHTML = sorted.map((dr, i) => {
    if (!dr.name) return '';
    const rank = i + 1;
    const tot  = draftTot(dr);
    const rc   = rank===1?'r1':rank===2?'r2':rank===3?'r3':'rn';
    const alive = dr.picks.filter(p => p.player && !p.eliminated).length;
    const isOpen = openCard === dr.name;

    const rows = dr.picks.map(p => {
      if (!p.player) return '';
      const pts = pickPts(p);
      const dot = p.eliminated ? 'out' : pts > 0 ? 'alive' : 'idle';
      return `<div class="pr ${p.eliminated?'elim':''}">
        ${logoImg(p.team)}
        <div class="pr-info">
          <div class="pr-name">${p.player}</div>
          <div class="pr-team">${p.team||'—'}</div>
        </div>
        <div class="pr-dot ${dot}"></div>
        <div class="pr-pts">${pts || '—'}</div>
      </div>`;
    }).join('');

    return `<div class="lb-card ${rc} ${isOpen?'open':''}" style="animation-delay:${i*.05}s"
        onclick="toggleCard('${dr.name.replace(/'/g,"\\'")}')">
      <div class="lb-head">
        <div class="lb-rank">${rank}</div>
        <div class="lb-info">
          <div class="lb-name">${dr.name}</div>
          <div class="lb-sub">${alive} alive · tap for players</div>
        </div>
        <div class="lb-score">
          <div class="lb-pts">${tot}</div>
          <div class="lb-ptslbl">PTS</div>
        </div>
        <svg class="lb-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="lb-panel"><div class="lb-panel-inner">${rows}</div></div>
    </div>`;
  }).join('');
}

window.toggleCard = function(name) {
  openCard = openCard === name ? null : name;
  renderBoard();
  if (openCard) setTimeout(() => {
    const e = document.querySelector('.lb-card.open');
    if (e) e.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 80);
};

function renderTeams() {
  const sorted = [...draft].sort((a,b) => draftTot(b) - draftTot(a));
  const el = document.getElementById('teamsStack');

  if (!sorted.some(d => d.name)) {
    el.innerHTML = `<div class="empty">
      <div class="ico">🏀</div>
      <h3>No Teams Yet</h3>
      <p>Tap <strong>Edit</strong> to enter your league's picks.</p>
    </div>`;
    return;
  }

  el.innerHTML = sorted.map((dr, i) => {
    const label = dr.name || `Team ${i+1}`;
    const tot   = draftTot(dr);
    const picks = dr.picks.filter(p => p.player);

    const rows = picks.map(p => {
      const pts = pickPts(p);
      const dot = p.eliminated ? 'out' : pts > 0 ? 'alive' : 'idle';
      return `<div class="pr ${p.eliminated?'elim':''}">
        ${logoImg(p.team)}
        <div class="pr-info">
          <div class="pr-name">${p.player}</div>
          <div class="pr-team">${p.team || '—'}</div>
        </div>
        <div class="pr-dot ${dot}"></div>
        <div class="pr-pts">${pts || '—'}</div>
      </div>`;
    }).join('');

    // Empty pick slots (greyed out placeholders)
    const empty = Array.from({length: 5 - picks.length}, (_, j) =>
      `<div class="pr" style="opacity:.25">
        <div class="pr-logofb">—</div>
        <div class="pr-info"><div class="pr-name" style="color:var(--text3)">Empty pick</div></div>
      </div>`
    ).join('');

    return `<div class="team-card" style="animation-delay:${i*.05}s">
      <div class="team-hdr">
        <div>
          <div class="team-owner">${label}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.5px">${picks.length} of 5 picks entered</div>
        </div>
        <div class="team-total">${tot || '—'}</div>
      </div>
      <div class="team-players">${rows}${empty}</div>
    </div>`;
  }).join('');
}

function renderBracket() {
  const wrap = document.getElementById('bracketWrap');
  if (!bracketData || !bracketData.length) {
    wrap.innerHTML = `<div class="bracket-msg">Bracket will appear once tournament begins.</div>`;
    return;
  }

  const ORDER = ['r1a','r1b','r16','r8','r4','champ'];
  const LABELS = {'r1a':'Round of 64','r1b':'Round of 32','r16':'Sweet 16','r8':'Elite 8','r4':'Final Four','champ':'Championship'};
  const byRound = {};
  for (const g of bracketData) {
    const rk = roundKey(g);
    if (!byRound[rk]) byRound[rk] = [];
    byRound[rk].push(g);
  }

  const rounds = ORDER.filter(r => byRound[r]?.length);
  if (!rounds.length) {
    wrap.innerHTML = `<div class="bracket-msg">No games found yet.</div>`;
    return;
  }

  wrap.innerHTML = `<div class="bracket">${rounds.map(rk => {
    const games = byRound[rk];
    const cards = games.map(g => {
      const comp  = (g.competitions||[])[0];
      const teams = comp?.competitors||[];
      const live  = g.status?.type?.state === 'in';
      const done  = g.status?.type?.completed;

      const teamRows = teams.map(t => {
        const won  = t.winner === true;
        const lost = done && t.winner === false;
        const seed = t.curatedRank?.current || t.team?.seed || '';
        const name = t.team?.shortDisplayName || t.team?.displayName || 'TBD';
        const score= (done || live) ? t.score : '';
        const abbr = (t.team?.abbreviation || name.slice(0,3)).toUpperCase();
        const lurl = t.team?.logos?.[0]?.href || null;
        const limg = lurl
          ? `<img class="b-tlogo" src="${lurl}" width="18" height="18" alt=""
               onerror="this.outerHTML='<div class=\\'b-tlogofb\\'>${abbr}</div>'" loading="lazy"/>`
          : `<div class="b-tlogofb">${abbr}</div>`;
        return `<div class="b-team ${won?'winner':lost?'loser':''}">
          <span class="b-seed">${seed}</span>${limg}
          <span class="b-tname">${name}</span>
          <span class="b-score">${score}</span>
        </div>`;
      }).join('');

      return `<div class="b-game ${live?'live':''}">
        ${teamRows}
        ${live ? `<div class="b-status">${g.status?.displayClock||''} LIVE</div>` : ''}
      </div>`;
    }).join('');

    return `<div class="b-round">
      <div class="b-round-lbl">${LABELS[rk]}</div>
      <div class="b-games">${cards}</div>
    </div>`;
  }).join('')}</div>`;
}

// ═══════════════════════════════════════════
// EDIT
// ═══════════════════════════════════════════
let _d = [];

function buildEdit() {
  _d = draft.map(dr => ({
    name: dr.name,
    picks: dr.picks.map(p => ({...p}))
  }));

  document.getElementById('editSlots').innerHTML = _d.map((dr, di) => `
    <div class="edit-card">
      <div class="edit-card-hdr">
        <div class="edit-num">${di+1}</div>
        <input class="edit-name-inp" type="text" placeholder="Friend's name"
          value="${dr.name}" oninput="_d[${di}].name=this.value"/>
      </div>
      <div class="picks-lbl">Player Name &amp; Team</div>
      ${dr.picks.map((p, pi) => `
        <div class="pick-row">
          <span class="pick-n">${pi+1}</span>
          <input class="pick-inp" type="text" placeholder="Player name"
            value="${p.player}" oninput="_d[${di}].picks[${pi}].player=this.value"/>
          <input class="pick-inp team-inp" type="text" placeholder="Team"
            value="${p.team}" oninput="_d[${di}].picks[${pi}].team=this.value"/>
        </div>`).join('')}
    </div>`).join('');
}

window.saveDraft = function() {
  draft = _d.map(dr => ({
    name: dr.name,
    picks: dr.picks.map(p => ({
      player: p.player||'', team: p.team||'',
      pts: p.pts||{}, eliminated: p.eliminated||false
    }))
  }));
  saveDraftLocal();
  toast('✓ Saved — stats will update automatically');
  renderAll();
  refresh();
};

window.clearDraft = function() {
  if (!confirm('Clear all picks?')) return;
  draft = defDraft();
  saveDraftLocal();
  buildEdit();
  renderAll();
};

// ═══════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════
window.goTab = function(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.querySelectorAll('.bni').forEach(b => b.classList.remove('on'));
  document.getElementById('v-' + name).classList.add('on');
  btn.classList.add('on');
  // Always re-render the target tab with latest data
  if (name === 'lb')      { renderStats(); renderBoard(); }
  if (name === 'teams')   renderTeams();
  if (name === 'bracket') renderBracket();
  if (name === 'edit')    buildEdit();
  window.scrollTo({top:0, behavior:'instant'});
};

window.toast = function(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 3000);
};

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
renderAll();
refresh();
setInterval(refresh, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
